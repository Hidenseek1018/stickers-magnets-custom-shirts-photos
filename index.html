<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Shop Photo Gallery</title>
    <style>
      :root {
        --bg: #f6f4f0;
        --surface: #ffffff;
        --ink: #1d1a16;
        --muted: #6e675c;
        --line: #e2dcd1;
        --accent: #b23a1f;
        --accent-ink: #ffffff;
        --tile: #ede8df;
        --chip: #efece6;
        --shadow: 0 10px 34px rgba(24, 18, 10, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171512;
          --surface: #211e1a;
          --ink: #f1ede4;
          --muted: #a79e8f;
          --line: #37322b;
          --accent: #e2704e;
          --accent-ink: #1c130e;
          --tile: #292520;
          --chip: #292520;
          --shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-system, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.45;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }

      /* ---------- Header ---------- */
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 14px 16px 12px;
      }
      .head-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 14px;
        max-width: 1400px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .totals { color: var(--muted); font-size: 0.92rem; }
      .search-row {
        max-width: 1400px;
        margin: 10px auto 0;
        display: flex;
        gap: 8px;
      }
      .search-wrap { position: relative; flex: 1 1 auto; }
      .search-wrap svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        stroke: var(--muted);
        pointer-events: none;
      }
      #search {
        width: 100%;
        min-height: 44px;
        padding: 10px 40px 10px 38px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
      }
      #search::placeholder { color: var(--muted); }
      #clearSearch {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 1.15rem;
        line-height: 1;
        display: none;
      }
      #themeSelect {
        display: none;
        width: 100%;
        min-height: 44px;
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }

      /* ---------- Layout ---------- */
      .layout {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 264px minmax(0, 1fr);
        gap: 0 22px;
        padding: 0 16px 40px;
        align-items: start;
      }
      aside {
        position: sticky;
        top: 132px;
        max-height: calc(100vh - 148px);
        overflow-y: auto;
        padding: 14px 6px 14px 0;
        scrollbar-width: thin;
      }
      aside h2 {
        margin: 2px 8px 8px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #themeList { list-style: none; margin: 0; padding: 0; }
      #themeList li { margin: 0; }
      .theme-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 38px;
        padding: 7px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        text-align: left;
        font-size: 0.93rem;
      }
      .theme-btn:hover { background: var(--chip); }
      .theme-btn[aria-current="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 650;
      }
      .theme-btn .count {
        flex: 0 0 auto;
        font-size: 0.78rem;
        color: var(--muted);
        background: var(--chip);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .theme-btn[aria-current="true"] .count {
        background: rgba(255, 255, 255, 0.22);
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        .theme-btn[aria-current="true"] .count { background: rgba(0, 0, 0, 0.25); }
      }

      /* ---------- Grid ---------- */
      main { min-width: 0; padding-top: 14px; }
      .results-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        margin-bottom: 12px;
      }
      .results-bar .now { font-size: 1.12rem; font-weight: 750; letter-spacing: -0.01em; }
      .results-bar .n { color: var(--muted); font-size: 0.92rem; }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
        gap: 12px;
      }
      .section-head {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 14px 0 -2px;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--line);
      }
      .section-head:first-child { margin-top: 0; }
      .section-head .t { font-size: 1.05rem; font-weight: 750; }
      .section-head .c { color: var(--muted); font-size: 0.88rem; }
      .card {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        overflow: hidden;
        padding: 0;
        text-align: left;
        width: 100%;
      }
      .card .thumb {
        display: block;
        aspect-ratio: 1 / 1;
        background: var(--tile);
      }
      .card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .card figcaption {
        display: block;
        padding: 7px 9px 8px;
        font-size: 0.8rem;
        line-height: 1.3;
        color: var(--ink);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.6em;
        word-break: break-word;
      }
      .card.img-error .thumb { display: none; }
      #sentinel { height: 8px; }
      #loadMoreWrap { text-align: center; padding: 20px 0 6px; display: none; }
      #loadMore {
        min-height: 44px;
        padding: 10px 26px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        font-weight: 650;
      }
      .empty {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 34px 18px;
        text-align: center;
        color: var(--muted);
        display: none;
      }
      .empty strong { color: var(--ink); display: block; font-size: 1.05rem; margin-bottom: 4px; }

      /* ---------- Lightbox ---------- */
      #lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(12, 10, 8, 0.92);
        display: none;
        flex-direction: column;
      }
      #lightbox.open { display: flex; }
      .lb-stage {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 14px;
      }
      .lb-stage img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: #fff;
        border-radius: 8px;
      }
      .lb-bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(20, 17, 14, 0.96);
        color: #f3efe7;
      }
      .lb-meta { flex: 1 1 auto; min-width: 0; }
      .lb-meta .fname {
        font-weight: 700;
        font-size: 0.98rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lb-meta .ftheme { color: #bdb4a4; font-size: 0.86rem; }
      .lb-btn {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: #f3efe7;
        font-size: 1.25rem;
        line-height: 1;
      }
      .lb-btn:disabled { opacity: 0.35; cursor: default; }

      /* ---------- Small screens ---------- */
      @media (max-width: 860px) {
        .layout { grid-template-columns: minmax(0, 1fr); padding: 0 12px 32px; }
        aside { display: none; }
        #themeSelect { display: block; }
        #grid { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 9px; }
        h1 { font-size: 1.25rem; }
        header { padding: 12px 12px 10px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="head-row">
        <h1>Shop Photo Gallery</h1>
        <span class="totals" id="totals"></span>
      </div>
      <div class="search-row">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
          <input id="search" type="search" placeholder="Search by photo name or theme…" autocomplete="off" aria-label="Search photos by name or theme" />
          <button id="clearSearch" type="button" aria-label="Clear search">×</button>
        </div>
      </div>
      <select id="themeSelect" aria-label="Choose a theme"></select>
    </header>

    <div class="layout">
      <aside aria-label="Themes">
        <h2>Themes</h2>
        <ul id="themeList"></ul>
      </aside>
      <main>
        <div class="results-bar">
          <span class="now" id="nowShowing"></span>
          <span class="n" id="resultCount"></span>
        </div>
        <div id="grid" role="list"></div>
        <div class="empty" id="emptyState">
          <strong>No photos match</strong>
          Try a different word, or pick another theme.
        </div>
        <div id="sentinel" aria-hidden="true"></div>
        <div id="loadMoreWrap"><button id="loadMore" type="button">Load more photos</button></div>
      </main>
    </div>

    <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <div class="lb-stage" id="lbStage">
        <img id="lbImg" alt="" />
      </div>
      <div class="lb-bar">
        <button class="lb-btn" id="lbPrev" type="button" aria-label="Previous photo">‹</button>
        <div class="lb-meta">
          <div class="fname" id="lbName"></div>
          <div class="ftheme" id="lbTheme"></div>
        </div>
        <button class="lb-btn" id="lbNext" type="button" aria-label="Next photo">›</button>
        <button class="lb-btn" id="lbClose" type="button" aria-label="Close viewer">×</button>
      </div>
    </div>

        btn.appendChild(thumb);
        btn.appendChild(cap);
        btn.addEventListener("click", function () { openLightbox(photoIdx); });
        return btn;
      }

      function updateMoreVisibility() {
        var more = state.rendered < state.filtered.length;
        els.loadMoreWrap.style.display = more ? "block" : "none";
        if (state.filtered.length) {
          els.resultCount.textContent =
            fmt(state.filtered.length) + (state.filtered.length === 1 ? " photo" : " photos") +
            (more ? " · showing " + fmt(state.rendered) : "");
        }
      }

      // Infinite scroll, with the Load more button as fallback.
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) renderBatch();
        }, { rootMargin: "900px 0px" });
        io.observe(els.sentinel);
      }
      els.loadMore.addEventListener("click", renderBatch);

      // ----- Search -----
      var searchTimer = null;
      els.search.addEventListener("input", function () {
        els.clearSearch.style.display = els.search.value ? "block" : "none";
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          state.query = els.search.value;
          applyFilters(false);
        }, 160);
      });
      els.clearSearch.addEventListener("click", function () {
        els.search.value = "";
        els.clearSearch.style.display = "none";
        state.query = "";
        applyFilters(false);
        els.search.focus();
      });

      // ----- Lightbox -----
      var lbIndex = -1; // position within state.filtered
      function openLightbox(photoIdx) {
        lbIndex = state.filtered.indexOf(photoIdx);
        if (lbIndex === -1) lbIndex = 0;
        showLightbox();
        els.lb.classList.add("open");
        document.body.style.overflow = "hidden";
        els.lbClose.focus();
      }
      function closeLightbox() {
        els.lb.classList.remove("open");
        document.body.style.overflow = "";
        els.lbImg.removeAttribute("src");
      }
      function showLightbox() {
        var p = photos[state.filtered[lbIndex]];
        var th = themes[p.t];
        els.lbImg.src = urlFor(th.slug, p.n);
        els.lbImg.alt = pretty(p.n);
        els.lbName.textContent = p.n + ".webp";
        els.lbTheme.textContent = th.label + " · photo " + fmt(lbIndex + 1) + " of " + fmt(state.filtered.length);
        els.lbPrev.disabled = lbIndex <= 0;
        els.lbNext.disabled = lbIndex >= state.filtered.length - 1;
      }
      function step(d) {
        var n = lbIndex + d;
        if (n < 0 || n >= state.filtered.length) return;
        lbIndex = n;
        showLightbox();
      }
      els.lbPrev.addEventListener("click", function () { step(-1); });
      els.lbNext.addEventListener("click", function () { step(1); });
      els.lbClose.addEventListener("click", closeLightbox);
      els.lbStage.addEventListener("click", function (e) { if (e.target === els.lbStage) closeLightbox(); });
      document.addEventListener("keydown", function (e) {
        if (!els.lb.classList.contains("open")) return;
        if (e.key === "Escape") closeLightbox();
        else if (e.key === "ArrowLeft") step(-1);
        else if (e.key === "ArrowRight") step(1);
      });
      // Basic swipe support on the stage.
      var touchX = null;
      els.lbStage.addEventListener("touchstart", function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
      els.lbStage.addEventListener("touchend", function (e) {
        if (touchX === null) return;
        var dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 48) step(dx < 0 ? 1 : -1);
        touchX = null;
      }, { passive: true });

      buildThemeControls();
      applyFilters(false);
    </script>
  </body>
</html>
